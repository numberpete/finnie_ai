# Single-container docker-compose for local development
# For production deployment, use the Dockerfile directly

services:
  finnie-ai:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CHART_URL=${CHART_URL:-http://localhost:8080/chart/}
      - CHART_PATH=generated_charts
    volumes:
      - ./src/data:/app/src/data  # FAISS indexes (pre-built)
      - finnie-charts:/app/generated_charts  # Generated charts
    restart: unless-stopped

volumes:
  finnie-charts:
    driver: local