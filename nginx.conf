worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # If this file doesn't exist in your image, comment this line out.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Websocket upgrade helper (must be in http scope)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream streamlit {
        server 127.0.0.1:8501;
    }

    upstream imageserver {
        server 127.0.0.1:8010;
    }

    server {
        listen 8080;
        server_name finnieai-production.up.railway.app;

        # Optional: quick sanity check that nginx is running
        location = /__nginx_ok {
            return 200 "nginx ok\n";
            add_header Content-Type text/plain;
        }

        # Streamlit app (default)
        location / {
            proxy_pass http://streamlit;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Preserve external scheme/host behind Railway's proxy
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host  $http_host;

            proxy_read_timeout 86400;
        }

        # Streamlit websocket
        location /_stcore/stream {
            proxy_pass http://streamlit/_stcore/stream;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host  $http_host;

            proxy_read_timeout 86400;
        }

        # Image retrieval
        location /chart/ {
            proxy_pass http://imageserver/chart/;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host  $http_host;
        }

        # REST listing endpoint (no slash)
        location = /charts {
            proxy_pass http://imageserver/charts;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host  $http_host;
        }

        # REST endpoints under /charts/
        location /charts/ {
            proxy_pass http://imageserver/charts/;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host  $http_host;
        }
    }
}
