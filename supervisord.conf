The test is failing because it's trying to connect to the MCP server at localhost:8002, but the server isn't running. These are integration tests that require the MCP servers to be running.

You have two options:

Option 1: Run the servers before testing

bash
# Terminal 1: Start the server
python -m src.mcp.yfinance_mcp

# Terminal 2: Run the test
pytest src/mcp/test_yfinance_mcp.py
Option 2: Mark these as integration tests and skip them by default

Update your test files to mark them as integration tests:

python
import pytest

@pytest.mark.integration
@pytest.mark.asyncio
async def test_yfinance_tools():
    # ... test code
Then in pytest.ini, add:

ini
markers =
    integration: marks tests as integration tests (require running servers)
And run unit tests without integration tests:

bash
pytest -m "not integration"
Or run everything (with servers running):

bash
pytest -m "integration"
Which do you prefer? These tests aren't broken — they're just integration tests that need the servers up. That's a normal pattern for testing services that depend on external processes.

