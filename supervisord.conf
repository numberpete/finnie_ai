[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:qanda-mcp]
command=python -m src.mcp.finance_q_and_a_mcp
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/var/log/supervisor/qanda-mcp.log
stderr_logfile=/var/log/supervisor/qanda-mcp-error.log
environment=PYTHONPATH="/app"

[program:yfinance-mcp]
command=python -m src.mcp.yfinance_mcp
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/var/log/supervisor/yfinance-mcp.log
stderr_logfile=/var/log/supervisor/yfinance-mcp-error.log
environment=PYTHONPATH="/app"

[program:charts-mcp]
command=python -m src.mcp.charts_mcp
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/var/log/supervisor/charts-mcp.log
stderr_logfile=/var/log/supervisor/charts-mcp-error.log
environment=PYTHONPATH="/app",CHART_PATH="generated_charts"

[program:goals-mcp]
command=python -m src.mcp.goals_mcp
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/var/log/supervisor/goals-mcp.log
stderr_logfile=/var/log/supervisor/goals-mcp-error.log
environment=PYTHONPATH="/app"

[program:portfolio-mcp]
command=python -m src.mcp.portfolio_mcp
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/var/log/supervisor/portfolio-mcp.log
stderr_logfile=/var/log/supervisor/portfolio-mcp-error.log
environment=PYTHONPATH="/app"

[program:image-server]
command=python -m src.servers.image_server
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/var/log/supervisor/image-server.log
stderr_logfile=/var/log/supervisor/image-server-error.log
environment=PYTHONPATH="/app",CHART_PATH="generated_charts"

[program:streamlit]
command=streamlit run src/ui/app.py --server.port=8501 --server.address=127.0.0.1 --server.headless=true
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=15
stdout_logfile=/var/log/supervisor/streamlit.log
stderr_logfile=/var/log/supervisor/streamlit-error.log
environment=PYTHONPATH="/app",CHART_URL="%(ENV_CHART_URL)s",CHART_PATH="generated_charts"

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx-error.log

; Ensure MCP servers start before Streamlit and nginx
[group:mcp-servers]
programs=qanda-mcp,yfinance-mcp,charts-mcp,goals-mcp,portfolio-mcp,image-server
priority=100

[group:frontend]
programs=streamlit,nginx
priority=200