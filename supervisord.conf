Great question. There's no strong reason to keep them separate for your use case. Running them all in one container would be:

Simpler:

No Docker networking issues (everything is localhost)
No health check timing problems
Matches how your start.sh runs locally
One image to build, not 7
Trade-offs of separate containers:

Separate Containers	Single Container
Can scale services independently	Simpler deployment
Isolate failures	No network complexity
"Microservices" pattern	Matches local dev
More resource overhead	Less resource overhead
For a capstone project / personal app, a single container makes way more sense.

