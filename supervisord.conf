You're partially right to be skeptical. Here's what I found:

OCI Always Free IS actually free, but with important caveats:

Idle instance reclamation - Idle Always Free compute instances may be reclaimed by Oracle. Oracle will deem virtual machine and bare metal compute instances as idle if, during a 7-day period, the following are true: CPU utilization for the 95th percentile is less than 20% 
Oracle
Capacity issues - ARM instances are in high demand and often "Out of Capacity" — you may not be able to provision one at all
Complexity - OCI is significantly more complex to set up than PaaS options
No support - Customers using only Always Free resources are not eligible for Oracle Support. 
Oracle
Credit card required - You will need a valid credit card for signup, "We do not accept virtual cards or prepaid cards. We accept credit cards and debit cards only." 
GitHub
So it's technically free forever if you:

Can actually get an instance (capacity lottery)
Keep CPU usage above 20% to avoid reclamation
Stay within limits
